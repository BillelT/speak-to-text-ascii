<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ASCII Speak</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div id="controls">
      <button id="mic-btn" type="button" aria-label="Micro">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2.5" width="6" height="11" rx="3" />
          <path d="M5.5 11a6.5 6.5 0 0 0 13 0" />
          <path d="M12 17.5v3.3" />
        </svg>
        <span id="mic-ring"></span>
      </button>
      <button id="keyboard-btn" type="button" aria-label="Saisie texte">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2.5" y="6" width="19" height="12" rx="2.5" />
          <path d="M6 10h.01M9.5 10h.01M13 10h.01M16.5 10h.01M6 14h9" />
        </svg>
      </button>
    </div>

    <form id="text-form" class="hidden">
      <input id="text-input" type="text" autocomplete="off" placeholder="Écrire un mot…" />
    </form>

    <button id="debug-toggle" type="button" aria-label="Debugger">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h13M21 18h-1" />
        <circle cx="15.5" cy="6" r="2" />
        <circle cx="7.5" cy="12" r="2" />
        <circle cx="18.5" cy="18" r="2" />
      </svg>
    </button>

    <aside id="debug-panel" class="hidden"></aside>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
